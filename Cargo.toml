[package]
# Ported from: More Red v1.21.1-6.0.0.3 (Commoble/morered, MIT), Minecraft Java
# 1.21.1 NeoForge. Local-only until the maintainer approves publishing.
name = "morered"
version = "0.2.3"
edition = "2024"
license = "MIT"
description = "More Red for Horizon: redstone logic gate plates, wires, cables and posts"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod`
# command. The launcher builds against its own copy of the same build.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
