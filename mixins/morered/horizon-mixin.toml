[mod]
id = "morered"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure logic-gate and wire model (standalone crate lib, injected as
# `crate::game::morered`).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "morered"
source = "runtime.rs"

# Game-side glue: signal answers, the dirty sets, the wire power solve and the
# level-tick apply.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "morered_state"
source = "support.rs"

# The content half is inside this bundle (`data/morered-content.hmod`, the
# built `content/morered.hmod`): this writes it to `.horizon-cache/` and appends
# it to the dev-mod list, so one `.hnmod` installs the plates, the wires and the
# code. The registry keeps one file per project, so a split port could not be
# listed; AE2 ships the same pattern.
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

# Answer 15 on a plate's output face, or a wire's per-face power.
[[injection]]
id = "block-signal"
hook = "block_signal"
hook_version = 1
kind = "HEAD"
helper = "signal.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "face", ty = "Direction", value = "face" },
  { name = "direct", ty = "bool", value = "direct" },
  { name = "signal", ty = "&mut i32", value = "signal" },
]

# Every plate, and every wire with a subwire, is a signal source.
[[injection]]
id = "signal-source"
hook = "is_signal_source"
hook_version = 1
kind = "HEAD"
helper = "source.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "source", ty = "&mut bool", value = "source" },
]

# Neighbour change: queue the plate / wire for the next level tick.
[[injection]]
id = "neighbor-changed"
hook = "neighbor_changed"
hook_version = 1
kind = "HEAD"
helper = "neighbor.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "dimension", ty = "LevelDimension", value = "dimension" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "state", ty = "BlockStateId", value = "state" },
]

# A placed/changed block: seed the first evaluation.
[[injection]]
id = "block-changed"
hook = "block_changed"
hook_version = 1
kind = "HEAD"
helper = "changed.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "dimension", ty = "LevelDimension", value = "dimension" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "new", ty = "BlockStateId", value = "new" },
]

# A wire's solving subwire disconnects when its support goes.
[[injection]]
id = "update-shape"
hook = "update_shape"
hook_version = 1
kind = "HEAD"
helper = "update_shape.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "dimension", ty = "LevelDimension", value = "dimension" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "direction", ty = "Direction", value = "direction" },
  { name = "neighbour", ty = "BlockStateId", value = "neighbour" },
  { name = "new", ty = "&mut Option<BlockStateId>", value = "new" },
]

# A spool click on a post: select the first post, link, cut or re-select.
[[injection]]
id = "use-item-on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "use_item_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]

# A placed wire starts attached to the face it was clicked against.
[[injection]]
id = "state-for-placement"
hook = "state_for_placement"
hook_version = 1
kind = "HEAD"
helper = "state_for_placement.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "context", ty = "&PlacementContext", value = "context" },
  { name = "answer", ty = "&mut Option<Option<BlockStateId>>", value = "answer" },
]

# The wire block declares a block entity for its per-face power.
[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "entity" },
]

# Clients get the wire's saved power array.
[[injection]]
id = "block-entity-update-tag"
hook = "block_entity_update_tag"
hook_version = 1
kind = "HEAD"
helper = "block_entity_update_tag.rs"
bindings = [
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "entity" },
  { name = "tag", ty = "&mut Option<horizon_world::nbt::Compound>", value = "tag" },
]

# End of the level tick: apply the queued wires and plates.
[[injection]]
id = "level-tick-post"
hook = "level_tick_post"
hook_version = 1
kind = "HEAD"
helper = "tick_post.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

# A wire or cable drops one item per attached subwire, none for the empty
# block (upstream's `morered:set_wire_count`); the hook carries the state.
[[injection]]
id = "loot-drops"
hook = "loot_drops"
hook_version = 1
kind = "HEAD"
helper = "loot_drops.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "context", ty = "&NativeLootDrops<'_>", value = "context" },
  { name = "drops", ty = "&mut Vec<ItemStack>", value = "drops" },
]
